spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes + blackbox
  metrics:
    distribution:
      slo:
        http.server.requests: 300ms,500ms,800ms,2s   # publishes the le buckets the latency SLIs read
budgetguard:
  faults:
    admin-enabled: ${BG_FAULTS_ADMIN:false}          # demo profile only (security-and-api.md T-7)
    admin-token: ${BG_FAULTS_TOKEN:}
bg:
  auth:
    demo-token: ${BG_AUTH_DEMO_TOKEN:demo}         # k6 traffic uses "Bearer demo"; not a credential
    demo-password: ${BG_AUTH_DEMO_PASSWORD:demo}
    token-ttl: 1h
    login-rate-limit:
      limit-for-period: 50                          # per refresh period; over it -> 429 (4xx, no budget burn)
      refresh-period: 1s
