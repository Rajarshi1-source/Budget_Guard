spring:
  application:
    name: orders-service
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes + blackbox
  metrics:
    distribution:
      slo:
        http.server.requests: 300ms,500ms,800ms,2s   # publishes the le buckets the latency SLIs read
budgetguard:
  faults:
    admin-enabled: ${BG_FAULTS_ADMIN:false}          # demo profile only (security-and-api.md T-7)
    admin-token: ${BG_FAULTS_TOKEN:}
bg:
  downstream:
    auth-url: ${BG_AUTH_URL:http://localhost:8081}                    # compose: http://auth-service:8080
    inventory-url: ${BG_INVENTORY_URL:http://localhost:8083}          # k3s: http://inventory.bg-apps.internal
    notifications-url: ${BG_NOTIFICATIONS_URL:http://localhost:8084}
