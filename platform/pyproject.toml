[project]
name = "budgetguard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.143.0",            # newest release older than two weeks on 24 Oct 2026 (Rev 2 said 0.128); re-check
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10",
  "redis>=6.4",                  # Valkey 9.1 speaks the same protocol
  "sqlalchemy[asyncio]>=2.0.44",
  "asyncpg>=0.30",
  "alembic>=1.17",
  "pyyaml>=6.0",
  "numpy>=2.3",
  "scipy>=1.16",
]

[project.optional-dependencies]
llm = ["openai>=2.0", "anthropic>=0.70"]   # only the brief-writer image installs these

[project.scripts]
bg = "budgetguard.rulegen.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14", "mypy>=1.18", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
packages = ["budgetguard"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budgetguard"]

