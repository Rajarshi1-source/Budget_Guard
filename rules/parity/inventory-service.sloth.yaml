# Generated by `bg export sloth` from slo/inventory-service.yaml. Do not edit.
version: prometheus/v1
service: inventory-service
labels:
  owner: team-commerce
slos:
- name: availability
  objective: 99.5
  sli:
    events:
      error_query: sum(rate(http_server_requests_seconds_count{service="inventory-service",uri!~"/actuator.*",status=~"5.."}[{{.window}}]))
      total_query: sum(rate(http_server_requests_seconds_count{service="inventory-service",uri!~"/actuator.*"}[{{.window}}]))
  alerting:
    name: SlothAvailability
    page_alert:
      disable: true
    ticket_alert:
      disable: true
- name: latency
  objective: 99.0
  sli:
    events:
      error_query: (sum(rate(http_server_requests_seconds_count{service="inventory-service",uri!~"/actuator.*"}[{{.window}}])) - sum(rate(http_server_requests_seconds_bucket{service="inventory-service",uri!~"/actuator.*",le="0.8"}[{{.window}}])))
      total_query: sum(rate(http_server_requests_seconds_count{service="inventory-service",uri!~"/actuator.*"}[{{.window}}]))
  alerting:
    name: SlothLatency
    page_alert:
      disable: true
    ticket_alert:
      disable: true
