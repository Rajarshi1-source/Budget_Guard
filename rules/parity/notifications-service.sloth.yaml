# Generated by `bg export sloth` from slo/notifications-service.yaml. Do not edit.
version: prometheus/v1
service: notifications-service
labels:
  owner: team-messaging
slos:
- name: availability
  objective: 99.0
  sli:
    events:
      error_query: sum(rate(http_server_requests_seconds_count{service="notifications-service",uri!~"/actuator.*",status=~"5.."}[{{.window}}]))
      total_query: sum(rate(http_server_requests_seconds_count{service="notifications-service",uri!~"/actuator.*"}[{{.window}}]))
  alerting:
    name: SlothAvailability
    page_alert:
      disable: true
    ticket_alert:
      disable: true
- name: latency
  objective: 95.0
  sli:
    events:
      error_query: (sum(rate(notification_delivery_seconds_count{service="notifications-service"}[{{.window}}])) - sum(rate(notification_delivery_seconds_bucket{service="notifications-service",le="120.0",outcome="delivered"}[{{.window}}])))
      total_query: sum(rate(notification_delivery_seconds_count{service="notifications-service"}[{{.window}}]))
  alerting:
    name: SlothLatency
    page_alert:
      disable: true
    ticket_alert:
      disable: true
