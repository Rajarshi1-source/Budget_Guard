# Platform alerts (Rev 2 §8): several services burning at once, BudgetGuard blind, heartbeat,
# and the W8.5 reconciler gauges (gate config drift, cluster digest drift, stale reconcilers).
rule_files:
  - ../generated/budgetguard-platform.rules.yaml
evaluation_interval: 30s
tests:
  - name: three services paging at once is a platform incident
    interval: 1m
    input_series:
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="auth-service",slo="availability"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="orders-service",slo="availability"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="orders-service",slo="latency"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="inventory-service",slo="latency"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformWideBurn
        exp_alerts:
          - exp_labels: {severity: page, service: platform, incident_type: platform_wide_burn}
            exp_annotations:
              summary: "3+ services are paging at once: treat as a platform incident; freeze only services whose self-inflicted burn pages"

  - name: two services paging (one with two SLOs) is not platform-wide
    interval: 1m
    input_series:
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="orders-service",slo="availability"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="orders-service",slo="latency"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="firing",service="auth-service",slo="availability"}'
        values: '1x10'
      - series: 'ALERTS{alertname="ErrorBudgetBurnPage",alertstate="pending",service="inventory-service",slo="availability"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformWideBurn
        exp_alerts: []

  - name: platform that cannot reach Prometheus pages after a minute
    interval: 30s
    input_series:
      - series: 'bg_prometheus_reachable{instance="platform-api-0"}'
        values: '1 1 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: BudgetGuardBlind
        exp_alerts:
          - exp_labels: {severity: page, service: budgetguard, incident_type: budgetguard_blind, instance: platform-api-0}
            exp_annotations:
              summary: "BudgetGuard cannot query Prometheus: integrity is STALE, each service's failure_mode decides (fail-open admits as admit_unverified)"
      - eval_time: 1m
        alertname: BudgetGuardBlind
        exp_alerts: []

  - name: heartbeat always fires
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none, service: budgetguard, incident_type: heartbeat}
            exp_annotations:
              summary: "Always firing. Route it to an external dead man's switch: if it stops arriving, Prometheus or Alertmanager is down and no rule here can say so"

  - name: an environment without the gate pages, with the reason
    interval: 1m
    input_series:
      - series: 'bg_gate_config_drift{instance="reconcilers:9465",job="reconcilers",service="orders-service",reason="admin_bypass_enabled"}'
        values: '1x10'
      - series: 'bg_gate_config_drift{instance="reconcilers:9465",job="reconcilers",service="auth-service",reason="protection_rule_missing"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: GateConfigDrift
        exp_alerts:
          - exp_labels: {severity: page, service: orders-service, reason: admin_bypass_enabled, incident_type: gate_config_drift}
            exp_annotations:
              summary: "production-orders-service does not enforce the BudgetGuard gate (admin_bypass_enabled): deploys can run without a decision"

  - name: a drifted rollout pages; a clean one does not
    interval: 1m
    input_series:
      - series: 'bg_cluster_digest_drift{instance="reconcilers:9465",job="reconcilers",service="auth-service"}'
        values: '1x10'
      - series: 'bg_cluster_digest_drift{instance="reconcilers:9465",job="reconcilers",service="orders-service"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: ClusterDigestDrift
        exp_alerts:
          - exp_labels: {severity: page, service: auth-service, incident_type: cluster_digest_drift}
            exp_annotations:
              summary: "auth-service runs an image no admitted deploy job set; recorded as an override by cluster-admin-drift"

  - name: a reconciler check that stops completing raises a ticket after 30 minutes
    interval: 1m
    input_series:
      - series: 'bg_reconciler_last_success_timestamp_seconds{instance="reconcilers:9465",job="reconcilers",check="environment"}'
        values: '0x60'                       # last success at t=0, never again
      - series: 'bg_reconciler_last_success_timestamp_seconds{instance="reconcilers:9465",job="reconcilers",check="redeliver"}'
        values: '0+60x60'                    # completes every minute
    alert_rule_test:
      - eval_time: 25m
        alertname: ReconcilersStale
        exp_alerts: []
      - eval_time: 40m
        alertname: ReconcilersStale
        exp_alerts:
          - exp_labels: {severity: ticket, service: budgetguard, check: environment, incident_type: reconcilers_stale}
            exp_annotations:
              summary: "The environment reconciler has not completed for 30 minutes: drift and failed deliveries are not being caught"
