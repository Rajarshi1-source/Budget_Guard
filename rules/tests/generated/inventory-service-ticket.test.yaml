      exp_annotations:
        summary: inventory-service latency is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/inventory-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="inventory-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="inventory-service",slo="latency"}'
      value: 0.016
  - expr: round(bg:error_ratio:rate6h{service="inventory-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="inventory-service",slo="latency"}'
      value: 0.016
- name: 'inventory-service latency: half the lowest ticket burn stays quiet'
  interval: 5m
