# Generated by `bg tests` from slo/inventory-service.yaml. Do not edit.
rule_files:
- ../../generated/inventory-service.rules.yaml
evaluation_interval: 1m
tests:
- name: 'inventory-service availability: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="inventory-service",status="200",uri="/test"}
    values: 0+4960x867
  - series: http_server_requests_seconds_count{error_origin="self",service="inventory-service",status="500",uri="/test"}
    values: 0+40x867
  - series: http_server_requests_seconds_bucket{le="0.8",service="inventory-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: inventory-service
        slo: availability
        incident_type: availability_slow_burn
      exp_annotations:
        summary: inventory-service availability is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/inventory-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="inventory-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="inventory-service",slo="availability"}'
      value: 0.008
  - expr: round(bg:error_ratio:rate6h{service="inventory-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="inventory-service",slo="availability"}'
      value: 0.008
- name: 'inventory-service availability: half the lowest ticket burn stays quiet'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="inventory-service",status="200",uri="/test"}
    values: 0+4990x867
  - series: http_server_requests_seconds_count{error_origin="self",service="inventory-service",status="500",uri="/test"}
    values: 0+10x867
  - series: http_server_requests_seconds_bucket{le="0.8",service="inventory-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts: []
- name: 'inventory-service latency: 1x over 3d/6h raises ticket'
