# Generated by `bg tests` from slo/notifications-service.yaml. Do not edit.
rule_files:
- ../../generated/notifications-service.rules.yaml
evaluation_interval: 1m
tests:
- name: 'notifications-service availability: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="notifications-service",status="200",uri="/test"}
    values: 0+4920x867
  - series: http_server_requests_seconds_count{error_origin="self",service="notifications-service",status="500",uri="/test"}
    values: 0+80x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: notifications-service
        slo: availability
        incident_type: availability_slow_burn
      exp_annotations:
        summary: notifications-service availability is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/notifications-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="notifications-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="notifications-service",slo="availability"}'
      value: 0.016
  - expr: round(bg:error_ratio:rate6h{service="notifications-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="notifications-service",slo="availability"}'
      value: 0.016
- name: 'notifications-service availability: half the lowest ticket burn stays quiet'
  interval: 5m
