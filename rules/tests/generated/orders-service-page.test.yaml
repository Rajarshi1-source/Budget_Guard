    values: 0+976.96x67
  - series: http_server_requests_seconds_count{error_origin="self",service="orders-service",status="500",uri="/test"}
    values: 0+23.04x67
  - series: http_server_requests_seconds_bucket{le="0.5",service="orders-service",uri="/test"}
    values: 0+1000x67
  alert_rule_test:
  - eval_time: 65m
    alertname: ErrorBudgetBurnPage
    exp_alerts:
