# Generated by `bg tests` from slo/orders-service.yaml. Do not edit.
rule_files:
- ../../generated/orders-service.rules.yaml
evaluation_interval: 1m
tests:
- name: 'orders-service availability: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="orders-service",status="200",uri="/test"}
    values: 0+4992x867
  - series: http_server_requests_seconds_count{error_origin="self",service="orders-service",status="500",uri="/test"}
    values: 0+8x867
  - series: http_server_requests_seconds_bucket{le="0.5",service="orders-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: orders-service
        slo: availability
        incident_type: availability_slow_burn
      exp_annotations:
        summary: orders-service availability is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/orders-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="orders-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="orders-service",slo="availability"}'
      value: 0.0016
  - expr: round(bg:error_ratio:rate6h{service="orders-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="orders-service",slo="availability"}'
      value: 0.0016
- name: 'orders-service availability: half the lowest ticket burn stays quiet'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="orders-service",status="200",uri="/test"}
    values: 0+4998x867
  - series: http_server_requests_seconds_count{error_origin="self",service="orders-service",status="500",uri="/test"}
    values: 0+2x867
  - series: http_server_requests_seconds_bucket{le="0.5",service="orders-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts: []
- name: 'orders-service latency: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{service="orders-service",uri="/test"}
    values: 0+5000x867
  - series: http_server_requests_seconds_bucket{le="0.5",service="orders-service",uri="/test"}
    values: 0+4920x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: orders-service
        slo: latency
        incident_type: latency_slow_burn
      exp_annotations:
        summary: orders-service latency is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/orders-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="orders-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="orders-service",slo="latency"}'
      value: 0.016
  - expr: round(bg:error_ratio:rate6h{service="orders-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="orders-service",slo="latency"}'
      value: 0.016
- name: 'orders-service latency: half the lowest ticket burn stays quiet'
  interval: 5m
  input_series:
