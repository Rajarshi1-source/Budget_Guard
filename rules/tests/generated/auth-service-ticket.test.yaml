# Generated by `bg tests` from slo/auth-service.yaml. Do not edit.
rule_files:
- ../../generated/auth-service.rules.yaml
evaluation_interval: 1m
tests:
- name: 'auth-service availability: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="auth-service",status="200",uri="/test"}
    values: 0+4996x867
  - series: http_server_requests_seconds_count{error_origin="self",service="auth-service",status="500",uri="/test"}
    values: 0+4x867
  - series: http_server_requests_seconds_bucket{le="0.3",service="auth-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: auth-service
        slo: availability
        incident_type: availability_slow_burn
      exp_annotations:
        summary: auth-service availability is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/auth-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="auth-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="auth-service",slo="availability"}'
      value: 0.0008
  - expr: round(bg:error_ratio:rate6h{service="auth-service",slo="availability"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="auth-service",slo="availability"}'
      value: 0.0008
- name: 'auth-service availability: half the lowest ticket burn stays quiet'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="auth-service",status="200",uri="/test"}
    values: 0+4999x867
  - series: http_server_requests_seconds_count{error_origin="self",service="auth-service",status="500",uri="/test"}
    values: 0+1x867
  - series: http_server_requests_seconds_bucket{le="0.3",service="auth-service",uri="/test"}
    values: 0+5000x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts: []
- name: 'auth-service latency: 1x over 3d/6h raises ticket'
  interval: 5m
  input_series:
  - series: http_server_requests_seconds_count{service="auth-service",uri="/test"}
    values: 0+5000x867
  - series: http_server_requests_seconds_bucket{le="0.3",service="auth-service",uri="/test"}
    values: 0+4920x867
  alert_rule_test:
  - eval_time: 4325m
    alertname: ErrorBudgetBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        service: auth-service
        slo: latency
        incident_type: latency_slow_burn
      exp_annotations:
        summary: auth-service latency is spending error budget steadily
        budgetguard_url: https://budgetguard.example.dev/services/auth-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate3d{service="auth-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="auth-service",slo="latency"}'
      value: 0.016
  - expr: round(bg:error_ratio:rate6h{service="auth-service",slo="latency"}, 0.0001)
    eval_time: 4325m
    exp_samples:
    - labels: '{service="auth-service",slo="latency"}'
      value: 0.016
- name: 'auth-service latency: half the lowest ticket burn stays quiet'
  interval: 5m
  input_series:
