evaluation_interval: 1m
tests:
- name: 'inventory-service availability: 14.4x over 1h/5m raises page'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{error_origin="none",service="inventory-service",status="200",uri="/test"}
    values: 0+884.8x67
  - series: http_server_requests_seconds_count{error_origin="self",service="inventory-service",status="500",uri="/test"}
    values: 0+115.2x67
  - series: http_server_requests_seconds_bucket{le="0.8",service="inventory-service",uri="/test"}
    values: 0+1000x67
  alert_rule_test:
  - eval_time: 65m
    alertname: ErrorBudgetBurnPage
    exp_alerts:
    - exp_labels:
        severity: page
        service: inventory-service
        slo: availability
        incident_type: availability_burn
      exp_annotations:
        summary: inventory-service availability is spending error budget fast
        budgetguard_url: https://budgetguard.example.dev/services/inventory-service
  promql_expr_test:
  - expr: round(bg:error_ratio:rate1h{service="inventory-service",slo="availability"}, 0.0001)
    eval_time: 65m
    exp_samples:
    - labels: '{service="inventory-service",slo="availability"}'
