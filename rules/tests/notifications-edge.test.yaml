# If every notification fails, the delivered bucket never exists: the latency SLI must read 1.0
# (all bad), never empty. Hand-written; the per-tier tests are generated by `bg tests`.
rule_files:
  - ../generated/notifications-service.rules.yaml
evaluation_interval: 1m
tests:
  - name: all deliveries failing reads as 100% bad
    interval: 1m
    input_series:
      - series: 'notification_delivery_seconds_count{service="notifications-service",channel="email",outcome="failed"}'
        values: '0+100x70'
    promql_expr_test:
      - expr: bg:error_ratio:rate5m{service="notifications-service",slo="latency"}
        eval_time: 65m
        exp_samples:
          - labels: 'bg:error_ratio:rate5m{service="notifications-service",slo="latency"}'
            value: 1
