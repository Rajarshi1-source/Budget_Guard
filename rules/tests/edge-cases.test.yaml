# Hand-written edge cases (budgetguard-slo-rules §3). The per-tier tests are generated by
# `bg tests` into generated/. "Silence is not health": a dead or unprobeable service must page.
rule_files:
  - ../generated/orders-service.rules.yaml
evaluation_interval: 30s
tests:
  - name: below the traffic floor a 22% error ratio stays quiet
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="200",error_origin="none"}'
        values: '0+7x180'
      - series: 'http_server_requests_seconds_bucket{service="orders-service",uri="/orders",le="0.5"}'
        values: '0+9x180'  # all requests fast: real services publish buckets                    # 7 + 2 = 9/min = 540/h < 600 floor (the floor counts errors too)
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="500",error_origin="self"}'
        values: '0+2x180'
      - series: 'up{job="orders-service"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetBurnPage
        exp_alerts: []

  - name: at exactly the floor the same burn pages
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="200",error_origin="none"}'
        values: '0+8x180'
      - series: 'http_server_requests_seconds_bucket{service="orders-service",uri="/orders",le="0.5"}'
        values: '0+10x180'  # all requests fast: real services publish buckets                    # 8 + 2 = 10/min = 600/h: meets the floor
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="500",error_origin="self"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetBurnPage
        exp_alerts:
          - exp_labels: {severity: page, service: orders-service, slo: availability, incident_type: availability_burn}
            exp_annotations:
              summary: "orders-service availability is spending error budget fast"
              budgetguard_url: "https://budgetguard.example.dev/services/orders-service"

  - name: dead target raises the integrity alert, not silence
    interval: 1m
    input_series:
      - series: 'up{job="orders-service"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: SLIIntegrityLost
        exp_alerts:                          # one alert per branch: up == 0 (carries job) and absent()
          - exp_labels: {severity: page, service: orders-service, incident_type: sli_integrity, job: orders-service}
            exp_annotations:
              summary: "orders-service: SLI signal lost; gate reports UNKNOWN"
          - exp_labels: {severity: page, service: orders-service, incident_type: sli_integrity}
            exp_annotations:
              summary: "orders-service: SLI signal lost; gate reports UNKNOWN"

  - name: failing readiness probe pages even while metrics still flow
    interval: 1m
    input_series:
      - series: 'up{job="orders-service"}'
        values: '1x10'
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="200",error_origin="none"}'
        values: '0+100x10'
      - series: 'http_server_requests_seconds_bucket{service="orders-service",uri="/orders",le="0.5"}'
        values: '0+100x10'  # all requests fast: real services publish buckets
      - series: 'probe_success{job="blackbox",service="orders-service",instance="http://orders-service:8080/actuator/health/readiness"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: SLIIntegrityLost
        exp_alerts:
          - exp_labels: {severity: page, service: orders-service, incident_type: sli_integrity, job: blackbox,
                         instance: "http://orders-service:8080/actuator/health/readiness"}
            exp_annotations:
              summary: "orders-service: SLI signal lost; gate reports UNKNOWN"

  - name: a one-scrape blip does not page (for 2m)
    interval: 1m
    input_series:
      - series: 'up{job="orders-service"}'
        values: '1 1 0 1 1 1 1 1'
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="200",error_origin="none"}'
        values: '0+100x8'
      - series: 'http_server_requests_seconds_bucket{service="orders-service",uri="/orders",le="0.5"}'
        values: '0+100x8'  # all requests fast: real services publish buckets
    alert_rule_test:
      - eval_time: 4m
        alertname: SLIIntegrityLost
        exp_alerts: []

  - name: healthy traffic with no 5xx series reads 0, not empty (zero errors is not "no data")
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="orders-service",uri="/orders",status="200",error_origin="none"}'
        values: '0+1000x70'
      - series: 'http_server_requests_seconds_bucket{service="orders-service",uri="/orders",le="0.5"}'
        values: '0+1000x70'  # all requests fast: real services publish buckets
    promql_expr_test:
      - expr: bg:error_ratio:rate5m{service="orders-service",slo="availability"}
        eval_time: 65m
        exp_samples:
          - labels: 'bg:error_ratio:rate5m{service="orders-service",slo="availability"}'
            value: 0
      - expr: bg:self_error_ratio:rate1h{service="orders-service",slo="availability"}
        eval_time: 65m
        exp_samples:
          - labels: 'bg:self_error_ratio:rate1h{service="orders-service",slo="availability"}'
            value: 0

  - name: no traffic at all stays empty, so the gate reports UNKNOWN (D-4)
    interval: 1m
    input_series:
      - series: 'up{job="orders-service"}'
        values: '1x70'
    promql_expr_test:
      - expr: bg:error_ratio:rate5m{service="orders-service",slo="availability"}
        eval_time: 65m
        exp_samples: []

