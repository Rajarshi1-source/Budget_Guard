    expr: |-
      (
      sum by (service) (rate(http_server_requests_seconds_count{service="auth-service",uri!~"/actuator.*",status=~"5.."}[5m]))
      or
      0 * sum by (service) (rate(http_server_requests_seconds_count{service="auth-service",uri!~"/actuator.*"}[5m]))
