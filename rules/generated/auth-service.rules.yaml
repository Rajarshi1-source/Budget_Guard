- name: bg:auth-service:alerts
  rules:
  - alert: ErrorBudgetBurnPage
    expr: |-
      (
      (bg:error_ratio:rate1h{service="auth-service",slo="availability"} > (14.4 * 0.0005)
       and bg:error_ratio:rate5m{service="auth-service",slo="availability"} > (14.4 * 0.0005))
       or
      (bg:error_ratio:rate6h{service="auth-service",slo="availability"} > (6 * 0.0005)
       and bg:error_ratio:rate30m{service="auth-service",slo="availability"} > (6 * 0.0005))
      )
      and on (service, slo) (bg:requests:rate1h{service="auth-service",slo="availability"} * 3600 >= 600)
    labels:
      severity: page
      service: auth-service
      slo: availability
      incident_type: availability_burn
    annotations:
      summary: auth-service availability is spending error budget fast
      budgetguard_url: https://budgetguard.example.dev/services/auth-service
  - alert: ErrorBudgetBurnTicket
    expr: |-
      (
      (bg:error_ratio:rate3d{service="auth-service",slo="availability"} > (1 * 0.0005)
       and bg:error_ratio:rate6h{service="auth-service",slo="availability"} > (1 * 0.0005))
      )
      and on (service, slo) (bg:requests:rate1h{service="auth-service",slo="availability"} * 3600 >= 600)
    labels:
      severity: ticket
      service: auth-service
      slo: availability
      incident_type: availability_slow_burn
    annotations:
      summary: auth-service availability is spending error budget steadily
      budgetguard_url: https://budgetguard.example.dev/services/auth-service
  - alert: ErrorBudgetBurnPage
    expr: |-
      (
      (bg:error_ratio:rate1h{service="auth-service",slo="latency"} > (14.4 * 0.01)
       and bg:error_ratio:rate5m{service="auth-service",slo="latency"} > (14.4 * 0.01))
      )
      and on (service, slo) (bg:requests:rate1h{service="auth-service",slo="latency"} * 3600 >= 600)
    labels:
      severity: page
      service: auth-service
      slo: latency
      incident_type: latency_burn
    annotations:
      summary: auth-service latency is spending error budget fast
      budgetguard_url: https://budgetguard.example.dev/services/auth-service
  - alert: ErrorBudgetBurnTicket
    expr: |-
      (
      (bg:error_ratio:rate3d{service="auth-service",slo="latency"} > (1 * 0.01)
       and bg:error_ratio:rate6h{service="auth-service",slo="latency"} > (1 * 0.01))
      )
      and on (service, slo) (bg:requests:rate1h{service="auth-service",slo="latency"} * 3600 >= 600)
    labels:
      severity: ticket
      service: auth-service
      slo: latency
      incident_type: latency_slow_burn
    annotations:
      summary: auth-service latency is spending error budget steadily
      budgetguard_url: https://budgetguard.example.dev/services/auth-service
  - alert: SLIIntegrityLost
    expr: |-
      up{job="auth-service"} == 0
      or absent(http_server_requests_seconds_count{service="auth-service"})
      or probe_success{job="blackbox",service="auth-service"} == 0
    for: 2m
    labels:
      severity: page
      service: auth-service
      incident_type: sli_integrity
    annotations:
      summary: 'auth-service: SLI signal lost; gate reports UNKNOWN'
