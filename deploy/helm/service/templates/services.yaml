{{- range $role := list "stable" "canary" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.service }}-{{ $role }}
spec:
  selector: { app: {{ $.Values.service }} }      # Argo Rollouts adds the pod-template-hash selector
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
