# Cloudflare Tunnel (namespace edge): the VM opens no inbound port. Only four things are public:
# the webhook and OIDC-authenticated decision reads on api.*, the dashboard, and read-only Grafana.
# edge.py's public-path guard repeats the API path filter inside the app (security-and-api.md §2).
# Edge rate limits are a Cloudflare WAF rule on the zone (see bootstrap.sh step 7), not configurable here.
apiVersion: v1
kind: ConfigMap
metadata: { name: cloudflared, namespace: edge }
data:
  config.yaml: |
    tunnel: budgetguard
    credentials-file: /etc/cloudflared/creds/credentials.json
    no-autoupdate: true
    ingress:
      - hostname: api.budgetguard.example.dev
        path: ^/v1/(github/webhook|decisions)$
        service: http://platform-api.bg-platform:8000
      - hostname: budgetguard.example.dev
        service: http://dashboard.bg-platform:3000
      - hostname: grafana.budgetguard.example.dev
        service: http://grafana.bg-platform:3000
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudflared, namespace: edge }
spec:
  replicas: 2
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1        # .env.versions CLOUDFLARED_TAG
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "--metrics", "0.0.0.0:2000", "run"]
          livenessProbe: { httpGet: { path: /ready, port: 2000 }, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared/config, readOnly: true }
            - { name: creds, mountPath: /etc/cloudflared/creds, readOnly: true }
      volumes:
        - { name: config, configMap: { name: cloudflared } }
        - { name: creds, secret: { secretName: cloudflared-credentials } }
