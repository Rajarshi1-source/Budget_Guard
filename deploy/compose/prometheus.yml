# budgetguard-slo-rules §5.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules/*.yaml]     # rules/generated, written by `bg generate`
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["auth-service:8080"]}]
  - job_name: orders-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["orders-service:8080"]}]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["inventory-service:8080"]}]
  - job_name: notifications-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["notifications-service:8080"]}]
  - job_name: blackbox
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:                                   # the SLO spec's `probe` must equal this instance label
          - http://auth-service:8080/actuator/health/readiness
          - http://orders-service:8080/actuator/health/readiness
          - http://inventory-service:8080/actuator/health/readiness
          - http://notifications-service:8080/actuator/health/readiness
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}
      # service label from the target host, so SLIIntegrityLost matches probes the same way in compose
      # and k3s (the probe URLs differ; the generated rules do not)
      - {source_labels: [__param_target], regex: 'https?://([a-z0-9-]+)[.:/].*', target_label: service}
  # BudgetGuard itself (W4): bg_prometheus_reachable feeds BudgetGuardBlind; the snapshotter's
  # leader gauge and last-bucket timestamp show whether history is still being written.
  - job_name: platform-api
    static_configs: [{targets: ["platform-api:8000"]}]
  - job_name: snapshotter
    dns_sd_configs: [{names: [snapshotter], type: A, port: 9464}]   # one target per replica
  # Gate workers (W8.7): bg_verdict_latency_seconds, the latency half of the meta-SLO.
  - job_name: gate-worker
    dns_sd_configs: [{names: [gate-worker], type: A, port: 9466}]
  # Reconcilers (W8.5, `--profile github` only): drift gauges for GateConfigDrift / ClusterDigestDrift.
  - job_name: reconcilers
    dns_sd_configs: [{names: [reconcilers], type: A, port: 9465}]   # no target when the profile is off
