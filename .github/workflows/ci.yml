name: ci

# Week 0 skeleton (plan W0.5): the Java build and the secret scan. Each week adds its job
# (python, rules, helm, dashboard) as in budgetguard-delivery-platform/references/manifests-and-workflows.md §8.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The wrapper pins Maven 3.9.16 (plan P-1), so CI and local builds use the same Maven.
      - run: ./mvnw -B -ntp verify

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0   # exact tag: setup-uv publishes no moving major (v10) tag
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Generated rules and tests must match the specs: a hand edit or a forgotten regenerate fails here.
      - run: uv run bg generate ../slo -o ../rules/generated --check
      - run: uv run bg tests ../slo -o ../rules/tests/generated --check

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: promtool (same version as the server, from .env.versions)
        run: |
          TAG=$(sed -n 's/^PROMETHEUS_TAG=\([^ #]*\).*/\1/p' deploy/compose/.env.versions)
          echo "promtool $TAG"
          docker run --rm -v "$PWD/rules:/rules" -w /rules --entrypoint sh "prom/prometheus:$TAG" \
            -c 'promtool check rules generated/*.yaml'
          docker run --rm -v "$PWD/rules:/rules" -w /rules/tests --entrypoint sh "prom/prometheus:$TAG" \
            -c 'promtool test rules *.test.yaml generated/*.test.yaml'

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # scan the whole history, not only the tip
      - name: gitleaks (same version and config as the pre-commit hook)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
