name: build-push

# Multi-arch images (the public VM is ARM64) with SBOM and provenance, signed keyless by digest.
# deploy.yml verifies the signature against this workflow's identity and commit before Helm sees it.
# Third-party actions are pinned by commit SHA (security-and-api.md change #14).
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write                    # cosign keyless (Fulcio certificate from this workflow's OIDC identity)

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [auth-service, orders-service, inventory-service, notifications-service, platform, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        if: endsWith(matrix.component, '-service')
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build the jar (services copy target/*.jar)
        if: endsWith(matrix.component, '-service')
        working-directory: services
        env: { C: "${{ matrix.component }}" }
        run: ./mvnw -B -ntp -DskipTests -pl "$C" -am package
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1     # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f          # v4.6.0
        with: { username: "${{ vars.DOCKERHUB_USER }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Context
        id: ctx
        env: { C: "${{ matrix.component }}" }
        run: |
          case "$C" in
            platform)  echo "dir=." ; echo "file=platform/Dockerfile" ;;   # specs and policy are baked in
            dashboard) echo "dir=dashboard" ; echo "file=dashboard/Dockerfile" ;;
            *)         echo "dir=services/$C" ; echo "file=services/$C/Dockerfile" ;;
          esac >> "$GITHUB_OUTPUT"
          echo "policy=$(git log -1 --format=%H -- policy/)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc     # v7.4.0
        id: build
        with:
          context: ${{ steps.ctx.outputs.dir }}
          file: ${{ steps.ctx.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_NS }}/${{ matrix.component }}:sha-${{ github.sha }}
          build-args: POLICY_VERSION=${{ steps.ctx.outputs.policy }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6    # v4.1.2 (cosign v3)
      - name: Sign by digest
        env:
          IMAGE: ${{ vars.DOCKERHUB_NS }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
